<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111216"><meta name="color-scheme" content="dark"><meta name="description" content="Exercícios de leitura em blocos, leitura guiada e percepção de palavras."><title>Leitura rápida — Stride</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="site-header"><a class="brand" href="./" aria-label="Stride — início">stride<span>.</span></a></header>
<main>
  <section id="practice-view" class="view">
    <div class="workspace-grid"><div class="training">
      <div class="mode-tabs" role="tablist" aria-label="Modo de exercício"><button role="tab" aria-selected="true" class="selected" data-mode="chunk"><small>01</small><span>Leitura em blocos</span></button><button role="tab" aria-selected="false" data-mode="paced"><small>02</small><span>Leitura guiada</span></button><button role="tab" aria-selected="false" data-mode="flash"><small>03</small><span>Palavras inteiras</span></button><button role="tab" aria-selected="false" data-mode="pairs"><small>04</small><span>Palavras parecidas</span></button><button role="tab" aria-selected="false" data-mode="search"><small>05</small><span>Localizar palavras</span></button></div>
      <div id="text-picker" class="text-picker">
        <div class="text-picker-summary" aria-live="polite"><strong id="selected-text-title"></strong><span id="selected-text-info"></span></div>
        <button id="new-reading" class="secondary" type="button">Nova leitura ↻</button>
      </div>
      <article class="exercise-card">
        <section id="word-search" aria-label="Localizar palavras" hidden>
          <div class="search-toolbar"><div><label for="search-syllables">Sílabas por palavra · dificuldade</label><select id="search-syllables"><option value="1">1 sílaba · Muito fácil</option><option value="2" selected>2 sílabas · Fácil</option><option value="3">3 sílabas · Intermediário</option><option value="4">4 sílabas · Difícil</option><option value="5">5 sílabas · Muito difícil</option></select></div><button id="search-new" class="secondary" type="button">Nova série ↻</button></div>
          <p class="search-instructions">Marque todas as ocorrências da palavra-alvo.</p>
          <ol id="search-exercises" class="search-exercises"></ol>
          <div class="search-footer"><div><p id="search-feedback" role="status" aria-live="polite"></p><p id="search-legend" hidden><span class="search-correct">✓ Correta</span> · <span class="search-missed">Não marcada (sublinhada)</span> · <span class="search-wrong">Incorreta (riscada)</span></p></div><div class="controls"><button id="search-clear" type="button" class="secondary">Limpar marcações</button><button id="search-check" type="button" class="primary">Conferir respostas →</button></div></div>
        </section>
        <div class="reader" id="reader"><div id="reading-content" class="reading-content"><span class="focus-corner tl"></span><span class="focus-corner tr"></span><span class="focus-corner bl"></span><span class="focus-corner br"></span><div id="word-display" tabindex="0" aria-label="Texto da leitura"></div></div><div class="read-track"><i id="read-fill"></i></div></div>
        <div class="settings" id="reading-settings"><label>Velocidade de leitura <span><output id="speed-value">250</output> <small>PPM</small></span><input id="speed" type="range" min="100" max="800" step="25" value="250"><div class="range-labels"><span>100 PPM</span><span>800 PPM</span></div></label><div class="chunk-setting"><label>Palavras por bloco</label><div class="chunk-buttons" aria-label="Palavras por bloco"><button data-chunk="1">1</button><button data-chunk="2">2</button><button data-chunk="3" class="selected" aria-pressed="true">3</button><button data-chunk="4">4</button><button data-chunk="5">5</button><button data-chunk="6">6</button></div></div></div>
        <div class="settings" id="visual-settings" hidden>
          <label><b class="exposure-label">Tempo por <span id="exposure-unit">palavra</span></b><span><output id="exposure-value">500</output> <small>ms</small></span><input id="exposure" type="range" min="150" max="2000" step="50" value="500"><div class="range-labels"><span>150 ms · rápido</span><span>2 s · tranquilo</span></div></label>
          <div id="syllable-setting"><label for="syllables">Sílabas por palavra</label><select id="syllables"><option value="2">2 sílabas</option><option value="3">3 sílabas</option><option value="4">4 sílabas</option></select></div>
          <div id="pair-syllable-setting" hidden><label for="pair-syllables">Sílabas por palavra</label><select id="pair-syllables"><option value="short">1–2 sílabas · Curtas</option><option value="3">3 sílabas · Médias</option><option value="4">4 sílabas · Longas</option><option value="5">5 sílabas · Muito longas</option></select></div>
        </div>
        <div class="exercise-footer"><span id="session-length">◷ Cerca de 1 minuto <span>·</span> Compreensão ao final</span><div class="controls"><button id="exit-focus" class="secondary" hidden>Sair do foco</button><button id="reset" class="secondary" hidden>Reiniciar</button><button id="start" class="primary">Iniciar prática <span>→</span></button></div></div>
      </article>
    </div></div>
  </section>


</main>
<dialog id="quiz" aria-labelledby="quiz-title"><form id="quiz-form">
  <div class="quiz-header"><h2 id="quiz-title">O que você compreendeu?</h2><button id="quiz-close" class="secondary" type="button" aria-label="Fechar questionário e voltar à prática">Fechar ×</button></div>
  <div class="quiz-body" id="quiz-body"><p id="quiz-question"></p><p id="quiz-feedback" aria-live="polite"></p><div id="quiz-options"></div></div>
  <div class="quiz-footer"><button class="primary" id="quiz-submit" type="submit">Verificar compreensão →</button></div>
</form></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="./app.js"></script>
</body></html>
